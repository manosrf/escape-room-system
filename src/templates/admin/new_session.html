{% extends "base.html" %}
{% block title %}New session for {{ room.name }}{% endblock %}
{% block content %}
  <a class="back-link" href="{{ url_for('admin_index') }}">&larr; Admin</a>
  <h1>New session &mdash; {{ room.name }}</h1>
  <form method="post" class="form">
    <label>Date &amp; time
      <input type="datetime-local" name="start_time" required>
    </label>
    <label>Capacity (defaults to room max: {{ room.max_players }})
      <input type="number" name="capacity" min="1" value="{{ room.max_players }}">
    </label>
    <button type="submit" class="btn">Add session</button>
  </form>
{% endblock %}
