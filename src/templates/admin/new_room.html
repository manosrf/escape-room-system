{% extends "base.html" %}
{% block title %}New room{% endblock %}
{% block content %}
  <a class="back-link" href="{{ url_for('admin_index') }}">&larr; Admin</a>
  <h1>New escape room</h1>
  <form method="post" class="form">
    <label>Name
      <input type="text" name="name" required>
    </label>
    <label>Theme
      <input type="text" name="theme" required>
    </label>
    <label>Description
      <textarea name="description" rows="4"></textarea>
    </label>
    <label>Min players
      <input type="number" name="min_players" min="1" value="2" required>
    </label>
    <label>Max players
      <input type="number" name="max_players" min="1" value="6" required>
    </label>
    <label>Duration (minutes)
      <input type="number" name="duration_minutes" min="15" value="60" required>
    </label>
    <label>Difficulty
      <select name="difficulty">
        <option>Easy</option>
        <option selected>Medium</option>
        <option>Hard</option>
      </select>
    </label>
    <label>Price per person (€)
      <input type="number" step="0.01" name="price_per_person" value="20.00" required>
    </label>
    <button type="submit" class="btn">Create room</button>
  </form>
{% endblock %}
