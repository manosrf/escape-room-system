services:
  - type: web
    name: escape-room-system
    runtime: python
    plan: free
    buildCommand: pip install -r lib/requirements.txt
    startCommand: cd src && python seed.py && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
